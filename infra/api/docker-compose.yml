# Paths relative to this file's directory (infra/api/) per Compose spec.
# context ../.. = project root; dockerfile path is relative to context.
services:
  agentic-rag-api:
    build:
      context: ../..
      # Shared Dockerfile; the `api` target reuses the common builder stage.
      dockerfile: infra/Dockerfile
      target: api
    container_name: agentic_rag_api
    # Read environment variables from the root .env file
    env_file:
      - ../../.env
    # Tiny init process improves signal handling and zombie process cleanup.
    init: true
    ports:
      - "${CORE_API_PORT:-8089}:8089"
    # Read-only bind mount is convenient for local development without letting the container mutate source.
    volumes:
      - ../../src:/app/src:ro
      # JWT signing keys (gitignored, not baked into the image) — mounted
      # read-only so the app can load them at startup. Generate with the
      # openssl commands in docs/auth/jwt_auth_design.md.
      - ../../keys:/app/keys:ro
      - ../../logs:/app/logs:rw
      - ../../data:/app/data:rw
      - hf-cache:/app/.cache/huggingface
    environment:
      UV_COMPILE_BYTECODE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HF_HOME: "/app/.cache/huggingface"
      HF_HUB_CACHE: "/app/.cache/huggingface/hub"
      FASTEMBED_CACHE_PATH: "/app/.cache/huggingface/fastembed"
    # Minimal hardening that stays low-friction for development.
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    # Healthcheck ensures container is responsive before marking healthy, with retries and timeouts for robustness.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - agentic-rag-network

networks:
  agentic-rag-network:
    name: agentic-rag-network
    external: true

volumes:
  hf-cache:
    name: agentic-rag-hf-cache
