[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "fastembed>=0.7.3",
    "langchain-text-splitters>=1.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.7.1",
    "qdrant-client>=1.13.2",
    "requests>=2.32.5",
    "uvicorn>=0.41.0",
    "streamlit>=1.42.2",
    "watchdog>=6.0.0",
    "mcp[cli]>=1.27.2",
    "python-multipart>=0.0.20",
    "pypdf>=5.1.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "openinference-semantic-conventions>=0.1.12",
    "psycopg[binary,pool]>=3.3.4",
    "ollama>=0.6.2",
    "huggingface-hub>=1.17.0",
    "langgraph>=1.2.4",
    "langchain>=1.3.4",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-ollama>=1.1.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9.0",
]
ingest = [
    "docling>=2.104.0",
    "torch",
    "torchvision",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

# --- Ruff: linter (check) + formatter (format) ---
# One fast tool replacing flake8 + isort + black. Config lives here so local
# runs and CI enforce identical rules.
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# E = pycodestyle, F = pyflakes (dead code, unused imports). Ruff's defaults.
[tool.ruff.lint.per-file-ignores]
# Router imports sit after `app` is created to avoid circular imports.
"src/app.py" = ["E402"]
# Imports follow a sys.path tweak in this manual log-check script.
"tests/test_logging.py" = ["E402"]

# --- Pytest: where tests live + default flags ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
