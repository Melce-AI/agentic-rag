# Agentic RAG Stack

include:
  # Main API
  - path: infra/api/docker-compose.yml
  # Qdrant Vector DB
  - path: infra/qdrant-db/docker-compose.yml
  # PostgreSQL relational DB (Sentinel MCP sql_query tool)
  - path: infra/postgres/docker-compose.yml
  # Frontend
  - path: infra/frontend/docker-compose.yml
  # Phoenix AI observability
  - path: infra/phoenix/docker-compose.yml

networks:
  agentic-rag-network:
    name: agentic-rag-network

volumes:
  hf-cache:
    name: agentic-rag-hf-cache
  qdrant_data:
    external: true